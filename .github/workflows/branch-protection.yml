name: Branch Protection

# Applies protection rules to `main` via the GitHub API: no deletion,
# no force-pushes, linear history, required review, and CI must pass
# before merge. Re-applies on every push to this file so the rules
# stay in sync with what's defined here, and can be run manually.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/branch-protection.yml"
  workflow_dispatch:

permissions:
  administration: write

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Apply protection rules to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/branches/main/protection" \
            --input - <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["build (ubuntu-latest)", "build (windows-latest)"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "required_approving_review_count": 1
            },
            "restrictions": null,
            "allow_deletions": false,
            "allow_force_pushes": false,
            "required_linear_history": true,
            "required_conversation_resolution": true,
            "lock_branch": false,
            "block_creations": false
          }
          JSON
