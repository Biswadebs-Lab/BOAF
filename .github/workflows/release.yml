name: Release

# Publish a versioned GitHub Release whenever a semantic-version tag is pushed.
# This keeps builds out of the way until a real release is intentionally cut.
permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: boaf
            asset_name: boaf-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: boaf.exe
            asset_name: boaf-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          asset_name="${{ matrix.asset_name }}-${{ github.ref_name }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "dist/${{ asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}-${{ github.ref_name }}
          path: dist/${{ matrix.asset_name }}-${{ github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts into one directory
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BOAF ${{ github.ref_name }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
