name: Release

# Automatically build the project on pushes to main and publish a GitHub
# Release with the generated binaries. This removes the need for manual
# tag creation while still producing downloadable release assets.
permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: boaf
            asset_name: boaf-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: boaf.exe
            asset_name: boaf-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "dist/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts into one directory
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-${{ github.run_number }}
          name: BOAF main build ${{ github.run_number }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
